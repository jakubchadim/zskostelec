  <circle cx="50" cy="40" r="5" fill="#fff9f0" stroke="#1d2150" stroke-width="3"/>
  <g fill="#fff9f0" stroke="#1d2150" stroke-width="2.5">
    <rect x="24" y="52" width="7" height="9" rx="1.5"/><rect x="69" y="52" width="7" height="9" rx="1.5"/>
    <rect x="39" y="52" width="7" height="9" rx="1.5"/><rect x="54" y="52" width="7" height="9" rx="1.5"/>
    <rect x="24" y="67" width="7" height="9" rx="1.5"/><rect x="69" y="67" width="7" height="9" rx="1.5"/>
  </g>
  <path d="M44 84 V72 A6 6 0 0 1 56 72 V84" fill="#1d2150"/>
